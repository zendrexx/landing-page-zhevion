<title>Zebite Beta Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
  :root{
    /* page chrome — theme-aware */
    --bg:#EDEAE2;
    --bg-soft:#E3DFD2;
    --ink:#22241D;
    --ink-soft:#6E6C5F;
    --line:rgba(34,36,29,.13);
    --stage-shadow:rgba(30,38,24,.28);

    /* fixed brand palette for the two posters — committed art, same in both themes */
    --paper:#FBF6E8;
    --paper-2:#F2EAD4;
    --forest:#1E3A28;
    --forest-soft:#2E4E37;
    --basil:#4F7C52;
    --basil-soft:#8CAE84;
    --sage:#DEE8D1;
    --sage-deep:#C9D9B8;
    --gold:#C89A3D;
    --gold-deep:#A87A26;
    --coral:#C56B4C;
    --cream-ink:#FBF6E8;

    --font-display:'Bricolage Grotesque','Segoe UI',sans-serif;
    --font-body:'Instrument Sans','Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'Cascadia Code',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141509;
      --bg-soft:#1B1C11;
      --ink:#EDEAE0;
      --ink-soft:#A6A38F;
      --line:rgba(237,234,224,.13);
      --stage-shadow:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141509;
    --bg-soft:#1B1C11;
    --ink:#EDEAE0;
    --ink-soft:#A6A38F;
    --line:rgba(237,234,224,.13);
    --stage-shadow:rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    background-image:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size:22px 22px;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    max-width:1040px;
    margin:0 auto;
    padding:clamp(28px,6vw,64px) clamp(18px,5vw,40px) clamp(48px,8vw,80px);
  }

  .intro{
    max-width:640px;
    margin:0 0 clamp(28px,5vw,44px);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 .9em;
  }
  .intro h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.7rem,3.6vw,2.5rem);
    line-height:1.12;
    letter-spacing:-.01em;
    margin:0 0 .5em;
    text-wrap:balance;
    color:var(--ink);
  }
  .dek{
    font-size:1rem;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:60ch;
    margin:0;
  }

  .gallery{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-start;
    gap:clamp(28px,4vw,48px);
  }
  .frame{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  figcaption{
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ===== poster shell ===== */
  .poster{
    position:relative;
    width:clamp(230px,38vw,380px);
    aspect-ratio:1284/2778;
    container-type:inline-size;
    border-radius:5cqi;
    overflow:hidden;
    box-shadow:
      0 2.2cqi 5cqi -1cqi var(--stage-shadow),
      0 0.4cqi 1cqi rgba(0,0,0,.18);
    display:flex;
    flex-direction:column;
    font-family:var(--font-body);
  }
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  /* ===================== POSTER 1 ===================== */
  .poster-1{
    background:var(--paper);
    padding:7cqi 6.5cqi 6cqi;
  }
  .p1-texture{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(58cqi 58cqi at 82% 10%, color-mix(in srgb, var(--basil) 14%, transparent), transparent 70%),
      radial-gradient(70cqi 70cqi at -10% 96%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%);
  }
  .p1-head{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .app-icon{
    width:15cqi;height:15cqi;border-radius:4.4cqi;
    background:var(--forest);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1cqi 2cqi rgba(30,58,40,.35);
  }
  .app-icon svg{width:64%;height:64%;}
  .wordmark{
    font-family:var(--font-display);
    font-weight:800;
    font-size:12.6cqi;
    letter-spacing:-.01em;
    color:var(--forest);
    margin:2.6cqi 0 0;
    line-height:1;
  }
  .tagline{
    font-size:3.5cqi;
    font-weight:500;
    color:var(--basil);
    margin:1.6cqi 0 0;
  }

  .p1-mid{
    position:relative;z-index:1;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:5cqi;
  }
  .p1-note{
    position:absolute;
    right:1.5cqi;
    top:1cqi;
    font-family:var(--font-display);
    font-weight:600;
    font-size:3.4cqi;
    line-height:1.42;
    color:var(--forest-soft);
    text-align:right;
  }
  .p1-note span{display:block;}
  .p1-note::before{
    content:"";
    display:block;
    width:3.2cqi;height:.5cqi;border-radius:1cqi;
    background:var(--gold);
    margin:0 0 1.2cqi auto;
  }

  .phone{
    width:58cqi;
    aspect-ratio:9/19.3;
    background:var(--forest);
    border-radius:7.5cqi;
    padding:1.4cqi;
    box-shadow:0 3cqi 4cqi -1.5cqi rgba(20,32,20,.55);
  }
  .phone-screen{
    position:relative;
    width:100%;height:100%;
    background:var(--paper-2);
    border-radius:6cqi;
    overflow:hidden;
    padding:5.4cqi 4.6cqi 3.6cqi;
    display:flex;
    flex-direction:column;
    gap:3.2cqi;
  }
  .island{
    position:absolute;top:1.6cqi;left:50%;transform:translateX(-50%);
    width:15cqi;height:2.6cqi;border-radius:2cqi;background:var(--forest);
    opacity:.9;
  }
  .scr-row{display:flex;align-items:flex-start;justify-content:space-between;margin-top:2.2cqi;}
  .greet-hi{font-size:2.5cqi;color:var(--basil);margin:0 0 .3cqi;}
  .greet-name{font-family:var(--font-display);font-weight:700;font-size:3.6cqi;color:var(--forest);}
  .bell-btn{
    width:6.4cqi;height:6.4cqi;border-radius:50%;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .bell-btn svg{width:56%;height:56%;}

  .budget-card{
    background:var(--paper);
    border:.25cqi solid color-mix(in srgb, var(--basil) 22%, transparent);
    border-radius:3.4cqi;
    padding:3.2cqi;
    display:flex;
    flex-direction:column;
    gap:2.4cqi;
  }
  .budget-top{display:flex;align-items:center;justify-content:space-between;}
  .budget-label{font-size:2.3cqi;color:var(--basil);margin:0 0 .8cqi;}
  .budget-amt{font-family:var(--font-mono);font-weight:600;font-size:4.4cqi;color:var(--forest);}
  .ring-wrap{position:relative;width:11cqi;height:11cqi;flex:none;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-txt{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-pct{font-family:var(--font-mono);font-weight:600;font-size:2.5cqi;color:var(--forest);line-height:1;}
  .ring-sub{font-size:1.5cqi;color:var(--basil-soft);margin-top:.2cqi;}
  .spent-row{display:flex;align-items:center;justify-content:space-between;gap:2cqi;}
  .bar-track{flex:1;height:1.6cqi;border-radius:1cqi;background:var(--sage-deep);overflow:hidden;}
  .bar-fill{height:100%;width:38%;border-radius:1cqi;background:var(--forest);}
  .spent-amt{font-family:var(--font-mono);font-size:2.1cqi;color:var(--forest-soft);white-space:nowrap;}

  .tile-row{display:flex;gap:2cqi;}
  .tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.2cqi;}
  .tile-ic{
    width:100%;aspect-ratio:1/1;border-radius:3cqi;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }
  .tile-ic svg{width:46%;height:46%;}
  .tile span{font-size:1.75cqi;color:var(--forest-soft);text-align:center;line-height:1.15;font-weight:500;}

  .sec-row{display:flex;align-items:baseline;justify-content:space-between;}
  .sec-title{font-family:var(--font-display);font-weight:700;font-size:2.7cqi;color:var(--forest);}
  .sec-link{font-size:2cqi;color:var(--gold-deep);font-weight:600;}

  .recipe-card{
    background:var(--paper);
    border-radius:3.4cqi;
    padding:2.4cqi;
    display:flex;
    align-items:center;
    gap:2.6cqi;
  }
  .plate{width:11cqi;height:11cqi;flex:none;}
  .recipe-name{font-family:var(--font-display);font-weight:700;font-size:2.5cqi;color:var(--forest);line-height:1.2;margin:0 0 1.2cqi;}
  .tag-row{display:flex;gap:1.2cqi;}
  .tag{
    font-size:1.5cqi;font-weight:600;color:var(--forest-soft);
    background:var(--sage);
    border-radius:2cqi;
    padding:.6cqi 1.4cqi;
  }

  .pantry-row{display:flex;gap:2.4cqi;}
  .stat-chip{
    flex:1;
    background:var(--paper);
    border-radius:3cqi;
    padding:2.2cqi 2.4cqi;
    display:flex;
    align-items:center;
    gap:1.6cqi;
  }
  .stat-chip svg{width:5.4cqi;height:5.4cqi;flex:none;}
  .stat-n{font-family:var(--font-mono);font-weight:600;font-size:2.6cqi;color:var(--forest);display:block;}
  .stat-l{font-size:1.6cqi;color:var(--basil-soft);}
  .stat-chip.warn .stat-n{color:var(--coral);}

  .p1-badge{
    position:relative;z-index:1;
    align-self:center;
    margin-top:5cqi;
    display:flex;align-items:center;gap:1.6cqi;
    background:var(--forest);
    color:var(--cream-ink);
    border-radius:8cqi;
    padding:2cqi 4.4cqi;
  }
  .p1-badge .bot{color:var(--cream-ink);}
  .p1-badge span{
    font-family:var(--font-display);
    font-weight:700;
    font-size:2.7cqi;
    letter-spacing:.01em;
  }

  /* ===================== POSTER 2 ===================== */
  .poster-2{
    background:var(--sage);
    padding:9cqi 7cqi 6cqi;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .p2-texture{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(85cqi 60cqi at 50% -6%, color-mix(in srgb, var(--paper) 55%, transparent), transparent 65%);
  }
  .gift{position:relative;z-index:1;width:42cqi;aspect-ratio:1/1;margin:0 auto 5cqi;}
  .gift-lid{position:absolute;top:6%;left:6%;width:88%;height:26%;background:var(--forest);border-radius:1.6cqi 1.6cqi .6cqi .6cqi;}
  .gift-body{position:absolute;top:30%;left:0;width:100%;height:70%;background:var(--basil);border-radius:0 0 1.6cqi 1.6cqi;}
  .gift-rv{position:absolute;top:6%;left:46.5%;width:7%;height:94%;background:var(--gold);}
  .gift-rh{position:absolute;top:16%;left:6%;width:88%;height:7%;background:var(--gold);}
  .bow-l,.bow-r{position:absolute;top:-9%;width:20%;aspect-ratio:1/1;background:var(--gold);border-radius:50% 50% 50% 4%;}
  .bow-l{left:24%;transform:rotate(-40deg);}
  .bow-r{left:56%;transform:rotate(40deg) scaleX(-1);}
  .bow-knot{position:absolute;top:-2%;left:45%;width:10%;aspect-ratio:1/1;background:var(--gold-deep);border-radius:.6cqi;}

  .p2-pill{
    position:relative;z-index:1;
    background:var(--forest);
    border-radius:8cqi;
    padding:2.2cqi 5cqi;
    display:inline-block;
  }
  .p2-pill span{
    font-family:var(--font-display);
    font-weight:700;
    font-size:5cqi;
    letter-spacing:.005em;
    color:var(--cream-ink);
  }
  .p2-pill span.hi{color:var(--gold);}

  .p2-dek{
    position:relative;z-index:1;
    font-size:3.4cqi;
    line-height:1.55;
    color:var(--forest-soft);
    max-width:74cqi;
    margin:3.4cqi auto 6cqi;
    font-weight:500;
  }

  .ticket{
    position:relative;z-index:1;
    width:86cqi;
    background:var(--paper);
    border-radius:4cqi;
    padding:4.4cqi 3cqi;
  }
  .ticket::before,.ticket::after{
    content:"";
    position:absolute;
    top:50%;transform:translateY(-50%);
    width:6cqi;height:6cqi;border-radius:50%;
    background:var(--sage);
  }
  .ticket::before{left:-3cqi;}
  .ticket::after{right:-3cqi;}
  .crown{width:6.4cqi;height:6.4cqi;margin:0 auto 1.8cqi;}
  .ticket-eyebrow{
    font-family:var(--font-display);
    font-weight:700;
    font-size:3cqi;
    letter-spacing:.08em;
    color:var(--forest);
    text-transform:uppercase;
  }
  .ticket-div{
    border:none;
    border-top:.3cqi dashed var(--sage-deep);
    margin:2.8cqi 6cqi;
  }
  .ticket-main{
    font-family:var(--font-display);
    font-weight:800;
    font-size:5.6cqi;
    color:var(--forest);
    letter-spacing:-.01em;
  }

  .p2-badge{
    position:relative;z-index:1;
    margin-top:auto;
    display:flex;align-items:center;gap:1.6cqi;
    background:var(--forest);
    color:var(--cream-ink);
    border-radius:8cqi;
    padding:2cqi 4.4cqi;
  }
  .p2-badge .bot{color:var(--cream-ink);}
  .p2-badge span{
    font-family:var(--font-display);
    font-weight:700;
    font-size:2.7cqi;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  /* small reusable bot glyph */
  .bot{position:relative;width:2.1em;height:2.1em;flex:none;color:inherit;}
  .bot i{position:absolute;background:currentColor;display:block;}
  .bot .head{inset:30% 8% 6% 8%;border-radius:38% 38% 26% 26%;}
  .bot .ant{width:10%;height:26%;top:8%;border-radius:2px;}
  .bot .ant.l{left:30%;transform:rotate(-18deg);}
  .bot .ant.r{right:30%;transform:rotate(18deg);}
  .bot .tip{width:16%;height:16%;border-radius:50%;top:4%;}
  .bot .tip.l{left:24%;}
  .bot .tip.r{right:24%;}
  .bot .eye{width:14%;height:14%;border-radius:50%;top:52%;background:var(--forest);}
  .bot .eye.l{left:26%;}
  .bot .eye.r{right:26%;}

  @media (max-width:620px){
    .gallery{justify-content:center;}
  }
  @media (prefers-reduced-motion:no-preference){
    .frame{animation:rise .6s ease both;}
    .frame:nth-child(2){animation-delay:.08s;}
    @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  }
</style>

<main class="stage">
  <header class="intro">
    <p class="eyebrow">Zebite · Android tester campaign</p>
    <h1>Same vibe, sharper execution</h1>
    <p class="dek">Both promo graphics rebuilt on a real type system and flat brand iconography — the cream-and-forest palette stays, the AI-poster gradients and clip-art don't.</p>
  </header>

  <div class="gallery">

    <figure class="frame">
      <div class="poster poster-1">
        <div class="p1-texture"></div>

        <div class="p1-head">
          <div class="app-icon">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M14 20c0-8 20-8 20 0" stroke="var(--paper)" stroke-width="3" stroke-linecap="round"/>
              <path d="M9 20h30l-4 19c-.3 1.7-1.8 3-3.5 3H16.5c-1.7 0-3.2-1.3-3.5-3Z" fill="var(--paper)"/>
              <path d="M18 24v12M24 24v12M30 24v12" stroke="var(--forest)" stroke-width="2" stroke-linecap="round"/>
              <path d="M29 11c2.5-3 6-2.4 6-2.4s-.3 3.6-3 5c-1.5.8-3.4 0-3-2.6Z" fill="var(--gold)"/>
            </svg>
          </div>
          <p class="wordmark">ZEBITE</p>
          <p class="tagline">Your groceries. Your budget. Your meals.</p>
        </div>

        <div class="p1-mid">
          <p class="p1-note"><span>Spend less.</span><span>Waste less.</span><span>Eat better.</span></p>

          <div class="phone">
            <div class="phone-screen">
              <div class="island"></div>

              <div class="scr-row">
                <div>
                  <p class="greet-hi">Good morning,</p>
                  <p class="greet-name">Zebite Fam 👋</p>
                </div>
                <div class="bell-btn">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 3.5a5 5 0 0 0-5 5v3.1c0 .7-.3 1.4-.8 1.9l-1 1.1c-.6.6-.2 1.6.6 1.6h12.4c.8 0 1.2-1 .6-1.6l-1-1.1a2.6 2.6 0 0 1-.8-1.9V8.5a5 5 0 0 0-5-5Z" stroke="var(--forest)" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M10.2 18.5a1.9 1.9 0 0 0 3.6 0" stroke="var(--forest)" stroke-width="1.6" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>

              <div class="budget-card">
                <div class="budget-top">
                  <div>
                    <p class="budget-label">This week's budget</p>
                    <p class="budget-amt num">₱2,000.00</p>
                  </div>
                  <div class="ring-wrap">
                    <svg viewBox="0 0 44 44">
                      <circle cx="22" cy="22" r="18" fill="none" stroke="var(--sage-deep)" stroke-width="4.5"/>
                      <circle cx="22" cy="22" r="18" fill="none" stroke="var(--forest)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="43"/>
                    </svg>
                    <div class="ring-txt">
                      <span class="ring-pct num">62%</span>
                      <span class="ring-sub">left</span>
                    </div>
                  </div>
                </div>
                <div class="spent-row">
                  <div class="bar-track"><div class="bar-fill"></div></div>
                  <span class="spent-amt num">₱1,250 spent</span>
                </div>
              </div>

              <div class="tile-row">
                <div class="tile">
                  <div class="tile-ic">
                    <svg viewBox="0 0 24 24"><polygon points="12,2 14.3,9.7 22,12 14.3,14.3 12,22 9.7,14.3 2,12 9.7,9.7" fill="var(--gold)"/></svg>
                  </div>
                  <span>AI Meal Plan</span>
                </div>
                <div class="tile">
                  <div class="tile-ic">
                    <svg viewBox="0 0 24 24" fill="none">
                      <rect x="6" y="9" width="12" height="11" rx="2" stroke="var(--forest)" stroke-width="1.6"/>
                      <path d="M9 9V7a3 3 0 0 1 6 0v2" stroke="var(--forest)" stroke-width="1.6"/>
                      <line x1="6" y1="13.5" x2="18" y2="13.5" stroke="var(--forest)" stroke-width="1.4"/>
                    </svg>
                  </div>
                  <span>Pantry</span>
                </div>
                <div class="tile">
                  <div class="tile-ic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--forest)" stroke-width="1.7" stroke-linecap="round">
                      <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/>
                      <path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/>
                      <path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/>
                      <path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/>
                    </svg>
                  </div>
                  <span>Scan Receipt</span>
                </div>
                <div class="tile">
                  <div class="tile-ic">
                    <svg viewBox="0 0 24 24" fill="none">
                      <rect x="4" y="5" width="16" height="12" rx="4" fill="var(--forest)"/>
                      <polygon points="9,17 9,20.5 13,17" fill="var(--forest)"/>
                      <circle cx="9.5" cy="11" r="1.4" fill="var(--paper)"/>
                      <circle cx="14.5" cy="11" r="1.4" fill="var(--paper)"/>
                    </svg>
                  </div>
                  <span>Ask Zeb</span>
                </div>
              </div>

              <div class="sec-row">
                <span class="sec-title">Today's Meal Plan</span>
                <span class="sec-link">See all</span>
              </div>
